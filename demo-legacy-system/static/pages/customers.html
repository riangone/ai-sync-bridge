<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>顧客管理 - 基幹業務システム(Legacy ERP)</title>
<link rel="stylesheet" href="/static/css/legacy.css">
</head>
<body onload="loadCustomers()">
<div id="header">基幹業務システム LEGACY-ERP v3.2</div>
<div id="nav">
    <a href="/pages/customers.html">顧客管理</a>
    <a href="/pages/orders.html">受注管理</a>
</div>
<div id="content">
    <h2>顧客一覧</h2>
    <table class="grid">
        <thead>
        <tr><th>ID</th><th>氏名</th><th>会社名</th><th>電話番号</th><th>状態</th></tr>
        </thead>
        <tbody id="customerRows"></tbody>
    </table>

    <fieldset>
        <legend>新規顧客登録</legend>
        <form method="post" action="/legacy-api/customers">
            <div><label>氏名</label><input type="text" name="name" required></div>
            <div><label>会社名</label><input type="text" name="company"></div>
            <div><label>電話番号</label><input type="text" name="phone"></div>
            <div><label>状態</label>
                <select name="status">
                    <option>取引中</option>
                    <option>休止</option>
                </select>
            </div>
            <input type="submit" value="登録">
        </form>
    </fieldset>
</div>
<div id="footer">Copyright (C) Legacy Systems Inc. All Rights Reserved. (AIサポートなし・改変不可を想定したデモ画面)</div>
<script src="/static/js/legacy.js"></script>
</body>
</html>
